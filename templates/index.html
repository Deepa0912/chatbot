<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Chatbot powered by GPT-4o - Ask anything and get instant intelligent responses.">
    <title>ChatBot AI — Intelligent Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#grad1)" opacity="0.9"/>
                            <path d="M2 17L12 22L22 17" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22">
                                    <stop offset="0%" stop-color="#6C63FF"/>
                                    <stop offset="100%" stop-color="#00D2FF"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo-text">ChatBot</span>
                </div>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Chat
            </button>

            <div class="sidebar-section">
                <div class="section-label">Model</div>
                <div class="model-badge">
                    <div class="model-dot"></div>
                    GPT-4o
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <div class="status-dot online"></div>
                    <span>Connected</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Top bar -->
            <header class="chat-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="header-title">
                    <h1>ChatBot AI</h1>
                    <span class="header-subtitle">Powered by GPT-4o</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="voiceToggleBtn" title="Toggle voice output">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                    <button class="icon-btn" id="clearChatBtn" title="Clear chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-glow"></div>
                    <div class="welcome-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#grad2)" opacity="0.9"/>
                            <path d="M2 17L12 22L22 17" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="grad2" x1="2" y1="2" x2="22" y2="22">
                                    <stop offset="0%" stop-color="#6C63FF"/>
                                    <stop offset="100%" stop-color="#00D2FF"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2>How can I help you today?</h2>
                    <p>I'm your AI assistant powered by GPT-4o. Ask me anything!</p>
                    
                    <div class="suggestion-cards">
                        <button class="suggestion-card" data-message="Explain quantum computing in simple terms">
                            <div class="card-icon">🧪</div>
                            <div class="card-text">
                                <strong>Explain</strong>
                                <span>Quantum computing simply</span>
                            </div>
                        </button>
                        <button class="suggestion-card" data-message="Write a Python function to sort a list using merge sort">
                            <div class="card-icon">💻</div>
                            <div class="card-text">
                                <strong>Write code</strong>
                                <span>Python merge sort</span>
                            </div>
                        </button>
                        <button class="suggestion-card" data-message="Give me 5 creative startup ideas for 2025">
                            <div class="card-icon">💡</div>
                            <div class="card-text">
                                <strong>Brainstorm</strong>
                                <span>Startup ideas for 2025</span>
                            </div>
                        </button>
                        <button class="suggestion-card" data-message="Write a short poem about the beauty of code">
                            <div class="card-icon">✨</div>
                            <div class="card-text">
                                <strong>Create</strong>
                                <span>A poem about code</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Message ChatBot..." 
                        rows="1"
                        autofocus
                    ></textarea>
                    <button class="mic-btn" id="micBtn" title="Voice input">
                        <svg class="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                        <div class="mic-pulse" id="micPulse"></div>
                    </button>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <p class="input-disclaimer">ChatBot can make mistakes. Consider checking important information.</p>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
